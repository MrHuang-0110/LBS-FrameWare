compiler_path: ./tools/rust-msc-latest-win10.exe
products:
  NEW-AI:
    protocol: custom_frame
    display_ports: 8
    baud: 115200
    folders: [app, music, boot, config, version]
    firmware_dir: ./products/NEW-AI/fwlib
    templates_dir: ./products/NEW-AI/templates   # 独立于 firmware_dir，改固件目录不影响模板查找
    max_slot: 19
    script_dirs: { ./products/NEW-AI/write: ./products/NEW-AI/app }
    chunk_size: 248
    last_frame_ack: wait_2s
    filename_encoding: gbk
    firmware_enter_cmd: RESET_FWLIB
    script_enter_cmd: RESET_FWLIB
    reopen_retries: 5
    reopen_delay: 2.0
    disappear_timeout: 2.0   # 发复位后等端口消失≤2s判为app模式(实测~1.4s)；超2s未断=已在固件模式,直接传输
    ble:
      enabled: true
      firmware_over_ble: false
  SPARK-AI:
    protocol: custom_frame
    display_ports: 4
    baud: 115200
    folders: [app, version]
    firmware_dir: ./products/SPARK-AI/fwlib
    templates_dir: ./products/SPARK-AI/templates
    max_slot: 9
    script_dirs: { ./products/SPARK-AI/write: ./products/SPARK-AI/app }
    chunk_size: 248
    last_frame_ack: wait_2s
    filename_encoding: gbk
    firmware_enter_cmd: RESET_FWLIB
    script_enter_cmd: RESET_FWLIB
    reopen_retries: 5
    reopen_delay: 2.0
    disappear_timeout: 2.0
    ble:
      enabled: true
      firmware_over_ble: false
  NEXT-AI:
    protocol: ymodem
    display_ports: 2
    baud: 115200
    folders: [__single__]
    firmware_dir: ./products/NEXT-AI/fwlib
    templates_dir: ./products/NEXT-AI/templates
    max_slot: 0
    script_dirs: { ./products/NEXT-AI/write: ./products/NEXT-AI/app }
    chunk_size: 1024
    last_frame_ack: skip
    filename_encoding: utf-8
    firmware_enter_cmd: "ymodem update fmware\r\n"
    script_enter_cmd: "ymodem\r\n"
    reopen_retries: 40
    reopen_delay: 3.0
    post_reopen_delay: 0.0   # YMODEM 靠等 'C' 握手，无需固定初始化等待
    disappear_timeout: 2.0
    ble:
      enabled: true
      firmware_over_ble: true
